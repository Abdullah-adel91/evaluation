<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>QA System 2.0</title>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>

<style>
body{font-family:tahoma;background:#f4f6f9;margin:20px}
h2{color:#1e3a8a}
select,button,input{padding:8px;margin:5px}
button{cursor:pointer;border:none;border-radius:6px}
.primary{background:#1e3a8a;color:white}
.secondary{background:#6b7280;color:white}
.criteria-item{margin:6px 0}
.popup{
display:none;position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:white;padding:20px;border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.3)
}
.popup textarea{width:300px;height:120px}
</style>
</head>

<body>

<h2>نظام تقييم الجودة 2.0</h2>

<select id="employeeSelect"></select>
<button onclick="openEmployeePopup()" class="secondary">➕ إضافة موظفين</button>
<button onclick="openCriteriaPopup()" class="secondary">⚙ إدارة البنود</button>

<hr>

<div id="criteriaContainer"></div>

<br>
<button onclick="showErrors()" class="secondary">إظهار الأخطاء</button>
<button onclick="saveEvaluation()" class="primary">حفظ التقييم</button>
<button onclick="exportExcel()" class="primary">تصدير Excel احترافي</button>
<button onclick="exportBackup()" class="secondary">📤 تصدير نسخة</button>
<input type="file" onchange="importBackup(event)"/>

<!-- إضافة موظفين -->
<div class="popup" id="employeePopup">
<h3>إضافة موظفين (كل اسم بسطر)</h3>
<textarea id="employeeNames"></textarea><br>
<button onclick="saveEmployees()" class="primary">حفظ</button>
<button onclick="closeEmployeePopup()">إغلاق</button>
</div>

<!-- إدارة البنود -->
<div class="popup" id="criteriaPopup">
<h3>إدارة البنود</h3>
<div id="manageCriteria"></div>
<input id="newCriteria" placeholder="بند جديد">
<button onclick="addCriteria()" class="primary">إضافة</button>
<button onclick="closeCriteriaPopup()">إغلاق</button>
</div>

<script>

// ================== DATA ==================
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let criteria = JSON.parse(localStorage.getItem("criteria")) || [
"ترحيب بداية المكالمة وذكر الاسم",
"طلب اسم المشترك وذكره مرة واحدة",
"أخذ رقم الحساب أو استخدام وسائل مساعدة",
"مطابقة بيانات الحساب",
"أخذ إذن المشترك قبل وضعه على الانتظار",
"إدارة وقت المكالمة",
"شكر المشترك على الانتظار",
"استخدام كلمات عامية",
"نبرة صوت واضحة",
"التسويق لتوثيق العداد",
"توثيق المكالمة",
"إنهاء صحيح للمكالمة"
];
let evaluations = JSON.parse(localStorage.getItem("evaluations")) || [];
let lastEvaluated = localStorage.getItem("lastEvaluated") || "";

// ================== RENDER ==================
function renderEmployees(){
let select=document.getElementById("employeeSelect");
select.innerHTML="";
employees.forEach(emp=>{
let option=document.createElement("option");
option.value=emp;
option.textContent = emp + (emp===lastEvaluated?" ⭐":"");
select.appendChild(option);
});
}

function renderCriteria(){
let container=document.getElementById("criteriaContainer");
container.innerHTML="";
criteria.forEach(c=>{
container.innerHTML+=`
<div class="criteria-item">
<label><input type="checkbox" value="${c}"> ${c}</label>
</div>`;
});
}

// ================== SAVE ==================
function saveEvaluation(){
let emp=document.getElementById("employeeSelect").value;
if(!emp) return alert("اختر موظف");

let errors=[];
document.querySelectorAll("#criteriaContainer input").forEach(cb=>{
if(cb.checked) errors.push(cb.value);
});

let score=prompt("أدخل درجة الفيرنت:");
if(score===null) return;

evaluations.push({
employee:emp,
score:Number(score),
errors:errors
});

localStorage.setItem("evaluations",JSON.stringify(evaluations));
localStorage.setItem("lastEvaluated",emp);
lastEvaluated=emp;
renderEmployees();
alert("تم حفظ التقييم ✔");
}

// ================== ERROR VIEW ==================
function showErrors(){
document.querySelectorAll("#criteriaContainer input").forEach(cb=>{
if(!cb.checked) cb.parentElement.style.display="none";
});
}

// ================== EXCEL ==================
async function exportExcel(){

const workbook = new ExcelJS.Workbook();

// تجميع البيانات
let grouped={};
evaluations.forEach(ev=>{
if(!grouped[ev.employee]){
grouped[ev.employee]={scores:[],warnings:0};
}
grouped[ev.employee].scores.push(ev.score);
if(ev.score===0) grouped[ev.employee].warnings++;
});

// ========== Overview ==========
const summarySheet = workbook.addWorksheet("Overview");
summarySheet.views = [{state:'frozen', ySplit:1}];

summarySheet.columns = [
{header:"الموظف", width:22},
{header:"عدد التقييمات", width:16},
{header:"تقييم1", width:10},
{header:"تقييم2", width:10},
{header:"تقييم3", width:10},
{header:"تقييم4", width:10},
{header:"تقييم5", width:10},
{header:"تقييم6", width:10},
{header:"تقييم7", width:10},
{header:"تقييم8", width:10},
{header:"المتوسط", width:14},
{header:"الإنذارات", width:14},
];

summarySheet.getRow(1).eachCell(cell=>{
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1E3A8A'}};
cell.font={color:{argb:'FFFFFF'},bold:true};
});

let summaryData=[];

employees.forEach(emp=>{
let scores = grouped[emp]?.scores || [];
let warnings = grouped[emp]?.warnings || 0;
let avg = scores.length? scores.reduce((a,b)=>a+b,0)/scores.length : 0;

let row = summarySheet.addRow([
emp + (emp===lastEvaluated?" ⭐":""),
scores.length,
...scores.slice(0,8),
avg,
warnings
]);

if(row.number%2===0){
row.eachCell(c=>{
c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'F3F4F6'}};
});
}

let avgCell = row.getCell(11);
if(avg<65){
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'DC2626'}};
avgCell.font={color:{argb:'FFFFFF'},bold:true};
}else if(avg<85){
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FACC15'}};
avgCell.font={bold:true};
}else{
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'16A34A'}};
avgCell.font={color:{argb:'FFFFFF'},bold:true};
}

summaryData.push({emp,avg,warnings,count:scores.length});
});

summarySheet.eachRow(row=>{
row.eachCell(cell=>{
cell.border={top:{style:'thin'},left:{style:'thin'},
bottom:{style:'thin'},right:{style:'thin'}};
});
});

// ========== Top & Review ==========
const topSheet = workbook.addWorksheet("Top & Review");
topSheet.views = [{state:'frozen', ySplit:1}];

topSheet.columns = [
{header:"الموظف", width:22},
{header:"المتوسط", width:14},
{header:"عدد التقييمات", width:16},
{header:"عدد الإنذارات", width:14}
];

topSheet.getRow(1).eachCell(cell=>{
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1E3A8A'}};
cell.font={color:{argb:'FFFFFF'},bold:true};
});

let sorted = [...summaryData]
.filter(e=>e.count>0)
.sort((a,b)=>{
if(b.avg!==a.avg) return b.avg-a.avg;
return a.warnings-b.warnings;
});

// Top 5
sorted.slice(0,5).forEach(e=>{
let r=topSheet.addRow([e.emp,e.avg,e.count,e.warnings]);
r.eachCell(c=>{
c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'DCFCE7'}};
});
});

topSheet.addRow([]);

// Needs Review
[...sorted]
.sort((a,b)=>{
if(a.avg!==b.avg) return a.avg-b.avg;
return b.warnings-a.warnings;
})
.slice(0,5)
.forEach(e=>{
let r=topSheet.addRow([e.emp,e.avg,e.count,e.warnings]);
if(e.avg<65){
r.getCell(2).fill={type:'pattern',pattern:'solid',fgColor:{argb:'DC2626'}};
r.getCell(2).font={color:{argb:'FFFFFF'},bold:true};
}else{
r.eachCell(c=>{
c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FEF9C3'}};
});
}
});

topSheet.eachRow(row=>{
row.eachCell(cell=>{
cell.border={top:{style:'thin'},left:{style:'thin'},
bottom:{style:'thin'},right:{style:'thin'}};
});
});

// ========== Performance Matrix ==========
const matrixSheet = workbook.addWorksheet("Performance Matrix");

matrixSheet.addRow(["الموظف",...criteria]);
matrixSheet.getRow(1).eachCell(cell=>{
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1E3A8A'}};
cell.font={color:{argb:'FFFFFF'},bold:true};
});

employees.forEach(emp=>{
let row=[emp];
criteria.forEach(c=>{
let count=0;
evaluations.forEach(ev=>{
if(ev.employee===emp && ev.errors.includes(c)) count++;
});
row.push(count);
});
let r = matrixSheet.addRow(row);

criteria.forEach((c,i)=>{
let cell=r.getCell(i+2);
if(cell.value>=6){
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'DC2626'}};
cell.font={color:{argb:'FFFFFF'}};
}else if(cell.value>=4){
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FACC15'}};
}
});
});

matrixSheet.eachRow(row=>{
row.eachCell(cell=>{
cell.border={top:{style:'thin'},left:{style:'thin'},
bottom:{style:'thin'},right:{style:'thin'}};
});
});

// ========== KPIs ==========
const kpiSheet = workbook.addWorksheet("KPIs");

let allScores=evaluations.map(e=>e.score);
let teamAvg = allScores.length? allScores.reduce((a,b)=>a+b,0)/allScores.length : 0;
let totalWarnings = evaluations.filter(e=>e.score===0).length;

kpiSheet.addRows([
["عدد التقييمات",evaluations.length],
["متوسط الفريق",teamAvg.toFixed(2)],
["عدد الإنذارات",totalWarnings]
]);

kpiSheet.eachRow(row=>{
row.eachCell(cell=>{
cell.border={top:{style:'thin'},left:{style:'thin'},
bottom:{style:'thin'},right:{style:'thin'}};
});
});

const buffer = await workbook.xlsx.writeBuffer();
saveAs(new Blob([buffer]), "QA_Report_2.0.xlsx");
}

// ================== BACKUP ==================
function exportBackup(){
let data={employees,criteria,evaluations};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.json";
a.click();
}

function importBackup(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(){
let data=JSON.parse(reader.result);
employees=data.employees;
criteria=data.criteria;
evaluations=data.evaluations;
localStorage.setItem("employees",JSON.stringify(employees));
localStorage.setItem("criteria",JSON.stringify(criteria));
localStorage.setItem("evaluations",JSON.stringify(evaluations));
renderEmployees();
renderCriteria();
alert("تم الاستيراد");
};
reader.readAsText(file);
}

// ================== EMPLOYEE ==================
function openEmployeePopup(){document.getElementById("employeePopup").style.display="block";}
function closeEmployeePopup(){document.getElementById("employeePopup").style.display="none";}
function saveEmployees(){
let names=document.getElementById("employeeNames").value.split("\n");
names.forEach(n=>{
if(n.trim() && !employees.includes(n.trim())){
employees.push(n.trim());
}
});
localStorage.setItem("employees",JSON.stringify(employees));
renderEmployees();
closeEmployeePopup();
}

// ================== CRITERIA ==================
function openCriteriaPopup(){
let div=document.getElementById("manageCriteria");
div.innerHTML="";
criteria.forEach((c,i)=>{
div.innerHTML+=`<div>${c} <button onclick="deleteCriteria(${i})">❌</button></div>`;
});
document.getElementById("criteriaPopup").style.display="block";
}
function closeCriteriaPopup(){document.getElementById("criteriaPopup").style.display="none";}
function addCriteria(){
let newC=document.getElementById("newCriteria").value;
if(newC){
criteria.push(newC);
localStorage.setItem("criteria",JSON.stringify(criteria));
renderCriteria();
openCriteriaPopup();
}
}
function deleteCriteria(i){
criteria.splice(i,1);
localStorage.setItem("criteria",JSON.stringify(criteria));
renderCriteria();
openCriteriaPopup();
}

renderEmployees();
renderCriteria();

</script>
</body>
</html>
