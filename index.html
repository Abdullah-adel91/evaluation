<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تقييم المكالمات – QA 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>

<style>
body{direction:rtl;font-family:Arial;padding:10px;background:#f5f5f5}
.item{background:#fff;margin:6px 0;padding:10px;border-radius:8px}
button{margin:3px;padding:6px 12px;font-size:16px;cursor:pointer}
.result{font-size:18px;font-weight:bold;margin-right:8px}
select,textarea{padding:8px;font-size:16px;margin-top:5px}
textarea{width:100%;}
.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
z-index:9999;
}
</style>
</head>
<body>

<h2 style="text-align:center">تقييم المكالمات</h2>

<!-- إدارة الموظفين -->
<div class="item">
<label>اسم الموظف:</label>
<select id="employeeSelect"></select>
<button onclick="openEmployeePopup()">➕ إضافة</button>
<button onclick="openCriteriaPopup()">⚙ البنود</button>
</div>

<hr>

<h3>تقييم المكالمات</h3>
<div id="criteria"></div>

<button onclick="showMistakes()">تصفية الأخطاء</button>
<button onclick="saveEvaluation()">حفظ التقييم</button>
<button onclick="resetView()">إعادة التقييم</button>

<hr>

<h3>نهاية الشهر</h3>
<button onclick="exportExcel()">📊 تحميل Excel احترافي</button>
<button onclick="exportBackup()">📤 تصدير نسخة</button>
<input type="file" onchange="importBackup(event)">

<!-- Popup إضافة موظفين -->
<div id="employeePopup" class="popup">
<h3>إضافة موظفين (سطر لكل اسم)</h3>
<textarea id="bulkEmployees"></textarea><br>
<button onclick="saveEmployeesBulk()">حفظ</button>
<button onclick="closeEmployeePopup()">إغلاق</button>
</div>

<!-- Popup إدارة البنود -->
<div id="criteriaPopup" class="popup">
<h3>إدارة البنود</h3>
<div id="criteriaManage"></div>
<input id="newCriteria" placeholder="بند جديد">
<button onclick="addCriteria()">إضافة</button>
<button onclick="closeCriteriaPopup()">إغلاق</button>
</div>

<script>

// ================= DATA =================
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let criteriaList = JSON.parse(localStorage.getItem("criteria")) || [
"ترحيب بداية المكالمة وذكر الاسم",
"طلب اسم المشترك وذكره مرة واحدة",
"أخذ رقم الحساب أو استخدام وسائل مساعدة",
"مطابقة بيانات الحساب",
"أخذ إذن المشترك قبل وضعه على الانتظار",
"إدارة وقت المكالمة",
"شكر المشترك على الانتظار",
"استخدام كلمات عامية",
"نبرة صوت واضحة",
"التسويق لتوثيق العداد",
"توثيق المكالمة",
"إنهاء صحيح للمكالمة"
];
let evaluations = JSON.parse(localStorage.getItem("evaluations")) || [];
let lastEvaluated = localStorage.getItem("lastEvaluated") || "";

// ================= RENDER =================
function loadEmployeeNames(){
const sel=document.getElementById("employeeSelect");
sel.innerHTML="";
employees.forEach(e=>{
let option=document.createElement("option");
option.value=e;
option.textContent=e + (e===lastEvaluated?" ⭐":"");
sel.appendChild(option);
});
}

function renderCriteria(){
const div=document.getElementById("criteria");
div.innerHTML="";
criteriaList.forEach(c=>{
div.innerHTML+=`
<div class="item">${c}<br>
<button onclick="setMark(this,'✔️')">✔️</button>
<button onclick="setMark(this,'✖️')">✖️</button>
<span class="result"></span>
</div>`;
});
}

function setMark(btn,val){
btn.parentElement.querySelector('.result').innerText=val;
}

function resetView(){
document.querySelectorAll('.result').forEach(r=>r.innerText='');
}

// ================= SAVE =================
function showMistakes(){
const results=[...document.querySelectorAll('.result')];
let mistakes=[];
results.forEach((r,i)=>{
if(r.innerText==='✖️') mistakes.push("- "+criteriaList[i]);
});
alert(mistakes.length?mistakes.join("\n"):"لا توجد أخطاء ✔️");
}

function saveEvaluation(){
const employee=document.getElementById("employeeSelect").value;
if(!employee) return alert("اختر موظف");

const results=[...document.querySelectorAll('.result')];
if(results.some(r=>!r.innerText)) return alert("قيّم كل البنود");

let score=prompt("أدخل درجة الفيرنت:");
if(score===null) return;
score=Number(score);

let mistakes=[];
results.forEach((r,i)=>{
if(r.innerText==='✖️') mistakes.push(criteriaList[i]);
});

evaluations.push({
employee,
score,
errors:mistakes
});

localStorage.setItem("evaluations",JSON.stringify(evaluations));
localStorage.setItem("lastEvaluated",employee);
lastEvaluated=employee;
loadEmployeeNames();
alert("تم الحفظ ✔️");
resetView();
}

// ================= POPUPS =================
function openEmployeePopup(){document.getElementById("employeePopup").style.display="block";}
function closeEmployeePopup(){document.getElementById("employeePopup").style.display="none";}
function saveEmployeesBulk(){
const text=document.getElementById("bulkEmployees").value;
const names=text.split(/\r?\n/).map(n=>n.trim()).filter(n=>n);
employees.push(...names);
employees=[...new Set(employees)];
localStorage.setItem("employees",JSON.stringify(employees));
loadEmployeeNames();
closeEmployeePopup();
}

function openCriteriaPopup(){
const div=document.getElementById("criteriaManage");
div.innerHTML="";
criteriaList.forEach((c,i)=>{
div.innerHTML+=`<div>${c} <button onclick="deleteCriteria(${i})">❌</button></div>`;
});
document.getElementById("criteriaPopup").style.display="block";
}
function closeCriteriaPopup(){document.getElementById("criteriaPopup").style.display="none";}
function addCriteria(){
const newC=document.getElementById("newCriteria").value;
if(newC){
criteriaList.push(newC);
localStorage.setItem("criteria",JSON.stringify(criteriaList));
renderCriteria();
openCriteriaPopup();
}
}
function deleteCriteria(i){
criteriaList.splice(i,1);
localStorage.setItem("criteria",JSON.stringify(criteriaList));
renderCriteria();
openCriteriaPopup();
}

// ================= BACKUP =================
function exportBackup(){
let data={employees,criteriaList,evaluations};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.json";
a.click();
}

function importBackup(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(){
let data=JSON.parse(reader.result);
employees=data.employees;
criteriaList=data.criteriaList;
evaluations=data.evaluations;
localStorage.setItem("employees",JSON.stringify(employees));
localStorage.setItem("criteria",JSON.stringify(criteriaList));
localStorage.setItem("evaluations",JSON.stringify(evaluations));
loadEmployeeNames();
renderCriteria();
alert("تم الاستيراد ✔️");
};
reader.readAsText(file);
}

// ================= EXCEL =================
async function exportExcel(){

const workbook = new ExcelJS.Workbook();

// تجميع
let grouped={};
evaluations.forEach(ev=>{
if(!grouped[ev.employee]){
grouped[ev.employee]={scores:[],warnings:0};
}
grouped[ev.employee].scores.push(ev.score);
if(ev.score===0) grouped[ev.employee].warnings++;
});

// ================= Overview =================
const sheet = workbook.addWorksheet("Overview");
sheet.views=[{state:'frozen',ySplit:1}];

sheet.columns=[
{header:"الموظف",width:22},
{header:"عدد التقييمات",width:16},
{header:"تقييم1",width:10},
{header:"تقييم2",width:10},
{header:"تقييم3",width:10},
{header:"تقييم4",width:10},
{header:"تقييم5",width:10},
{header:"تقييم6",width:10},
{header:"تقييم7",width:10},
{header:"تقييم8",width:10},
{header:"المتوسط",width:14},
{header:"الإنذارات",width:14}
];

sheet.getRow(1).eachCell(cell=>{
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1E3A8A'}};
cell.font={color:{argb:'FFFFFF'},bold:true};
});

let summaryData=[];

employees.forEach(emp=>{
let scores=grouped[emp]?.scores||[];
let warnings=grouped[emp]?.warnings||0;
let avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;

let row=sheet.addRow([
emp + (emp===lastEvaluated?" ⭐":""),
scores.length,
...scores.slice(0,8),
avg,
warnings
]);

if(row.number%2===0){
row.eachCell(c=>c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'F3F4F6'}});
}

let avgCell=row.getCell(11);
if(avg<65){
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'DC2626'}};
avgCell.font={color:{argb:'FFFFFF'},bold:true};
}else if(avg<85){
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FACC15'}};
avgCell.font={bold:true};
}else{
avgCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'16A34A'}};
avgCell.font={color:{argb:'FFFFFF'},bold:true};
}

summaryData.push({emp,avg,warnings,count:scores.length});
});

// ================= Performance Matrix =================
const matrix=workbook.addWorksheet("Performance Matrix");
matrix.addRow(["الموظف",...criteriaList]);
matrix.getRow(1).eachCell(cell=>{
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1E3A8A'}};
cell.font={color:{argb:'FFFFFF'},bold:true};
});

employees.forEach(emp=>{
let row=[emp];
criteriaList.forEach(c=>{
let count=0;
evaluations.forEach(ev=>{
if(ev.employee===emp && ev.errors.includes(c)) count++;
});
row.push(count);
});
let r=matrix.addRow(row);
criteriaList.forEach((c,i)=>{
let cell=r.getCell(i+2);
if(cell.value>=6){
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'DC2626'}};
cell.font={color:{argb:'FFFFFF'}};
}else if(cell.value>=4){
cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FACC15'}};
}
});
});

// ================= KPIs =================
const kpi=workbook.addWorksheet("KPIs");
let allScores=evaluations.map(e=>e.score);
let teamAvg=allScores.length?allScores.reduce((a,b)=>a+b,0)/allScores.length:0;
let warningsTotal=evaluations.filter(e=>e.score===0).length;

kpi.addRows([
["عدد التقييمات",evaluations.length],
["متوسط الفريق",teamAvg.toFixed(2)],
["عدد الإنذارات",warningsTotal]
]);

const buffer = await workbook.xlsx.writeBuffer();
saveAs(new Blob([buffer]), "QA_Report_2.0.xlsx");
}

// ================= INIT =================
loadEmployeeNames();
renderCriteria();

</script>
</body>
</html>
