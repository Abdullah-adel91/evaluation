<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>نظام تقييم الجودة QA 2.0</title>

<!-- ExcelJS + FileSaver -->
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>

<style>
  body{direction:rtl;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;padding:12px}
  h2{text-align:center;color:#1e293b;margin-bottom:10px}
  .item{background:#fff;margin:8px 0;padding:12px;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{padding:8px 12px;border-radius:8px;border:0;background:#1e3a8a;color:#fff;cursor:pointer;font-size:15px}
  button.secondary{background:#6b7280}
  button.warn{background:#dc2626}
  label{font-weight:600;margin-left:8px}
  /* العرض البسيط للبند مثل النسخة الأولى */
  .criteria-simple{background:#fff;margin:8px 0;padding:10px;border-radius:8px}
  .criteria-simple .text{display:inline-block;vertical-align:middle}
  .criteria-simple .actions{display:inline-block;vertical-align:middle;margin-left:12px}
  .criteria-simple .actions button{margin-left:6px}
  .result{font-weight:700;margin-right:8px;font-size:18px;min-width:36px;display:inline-block}
  .popup{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999;
    background:#fff;padding:16px;border-radius:10px;box-shadow:0 6px 24px rgba(2,6,23,0.15);width:90%;max-width:480px}
  textarea{width:100%;min-height:120px;padding:8px;font-size:15px;border-radius:6px;border:1px solid #e5e7eb}
  input[type=file]{display:inline-block}
  .small{padding:6px 10px;font-size:14px}
  footer{margin-top:18px;text-align:center;color:#64748b;font-size:13px}
  @media (max-width:480px){
    .controls{flex-direction:column}
    .criteria-simple{font-size:15px}
    button{width:100%}
  }
</style>
</head>
<body>

<h2>تقييم المكالمات — QA System 2.0</h2>

<!-- إدارة الموظفين -->
<div class="item">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <label for="employeeSelect">اسم الموظف:</label>
    <select id="employeeSelect" style="padding:8px;font-size:15px;min-width:200px"></select>
    <div class="controls" style="margin-left:auto">
      <button class="secondary small" onclick="openEmployeePopup()">➕ إضافة موظفين</button>
      <button class="secondary small" onclick="openCriteriaPopup()">⚙ إدارة البنود</button>
    </div>
  </div>
</div>

<!-- بنود التقييم (بصيغة النسخة الأولى: عرض بسيط لكل بند مع زر ✔ و ✖) -->
<div class="item">
  <h3 style="margin:0 0 8px 0">تقييم المكالمات</h3>
  <div id="criteriaContainer"></div>

  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="showMistakes()" class="secondary small">عرض الأخطاء (تصفية)</button>
    <button onclick="saveEvaluation()" class="small">حفظ التقييم</button>
    <button onclick="resetView()" class="secondary small">إعادة التقييم</button>
  </div>
</div>

<!-- نهاية الشهر -->
<div class="item">
  <h3 style="margin:0 0 8px 0">نهاية الشهر</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button onclick="exportExcel()">📊 تحميل Excel احترافي</button>
    <button onclick="resetMonthData()" class="small">حذف بيانات الشهر</button>
    <button onclick="exportBackup()" class="secondary small">📤 تصدير نسخة</button>
    <input type="file" id="importFile" onchange="importBackup(event)" />
  </div>
  <div style="margin-top:8px;color:#475569;font-size:13px">
    ملاحظة: زر "تصدير نسخة" ينشئ ملف JSON يمكنك رفعه على جهاز آخر عبر "استيراد" لإحضار الموظفين، البنود، والتقييمات.
  </div>
</div>

<!-- Popup: إضافة موظفين -->
<div id="employeePopup" class="popup" aria-hidden="true">
  <h3 style="margin-top:0">إضافة موظفين (كل اسم بسطر)</h3>
  <textarea id="bulkEmployees" placeholder="الصق الأسماء أو اكتبها كل سطر لاسم"></textarea>
  <div style="text-align:left;margin-top:10px">
    <button onclick="saveEmployeesBulk()">حفظ</button>
    <button class="secondary" onclick="closeEmployeePopup()">إغلاق</button>
  </div>
</div>

<!-- Popup: إدارة البنود -->
<div id="criteriaPopup" class="popup" aria-hidden="true">
  <h3 style="margin-top:0">إدارة البنود</h3>
  <div id="criteriaManage" style="max-height:300px;overflow:auto;margin-bottom:8px"></div>
  <input id="newCriteria" placeholder="اكتب بند جديد ثم اضغط إضافة" style="width:100%;padding:8px;border-radius:6px;border:1px solid #e6e9ef" />
  <div style="text-align:left;margin-top:10px">
    <button onclick="addCriteria()">إضافة</button>
    <button class="secondary" onclick="closeCriteriaPopup()">إغلاق</button>
  </div>
</div>

<footer>صُنع لك — إذا احتجت أي تعديل قل لي وأنا أنفذ بسرعة.</footer>

<script>
/* ============================
   Stable localStorage keys
   ============================ */
const KEY_EMPLOYEES = "employees";
const KEY_CRITERIA = "criteriaList";
const KEY_EVALS = "evaluations";
const KEY_LAST = "lastEvaluated";

/* Default criteria full list */
const DEFAULT_CRITERIA = [
  "ترحيب بداية المكالمة وذكر الاسم",
  "طلب اسم المشترك وذكره مرة واحدة",
  "أخذ رقم الحساب أو استخدام وسائل مساعدة",
  "مطابقة بيانات الحساب",
  "أخذ إذن المشترك قبل وضعه على الانتظار",
  "إدارة وقت المكالمة",
  "شكر المشترك على الانتظار",
  "استخدام كلمات عامية",
  "نبرة صوت واضحة",
  "التسويق لتوثيق العداد",
  "توثيق المكالمة",
  "إنهاء صحيح للمكالمة"
];

/* Load data or defaults */
let employees = JSON.parse(localStorage.getItem(KEY_EMPLOYEES)) || [];
let criteriaList = JSON.parse(localStorage.getItem(KEY_CRITERIA)) || DEFAULT_CRITERIA.slice();
let evaluations = JSON.parse(localStorage.getItem(KEY_EVALS)) || [];
let lastEvaluated = localStorage.getItem(KEY_LAST) || "";

/* ===== Render UI (simple criteria display like original) ===== */
function loadEmployeeNames(){
  const sel = document.getElementById("employeeSelect");
  sel.innerHTML = "";
  employees.forEach(emp => {
    const opt = document.createElement("option");
    opt.value = emp;
    opt.textContent = emp + (emp === lastEvaluated ? " ⭐" : "");
    sel.appendChild(opt);
  });
  if(employees.length === 0){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "لا يوجد موظفين — أضف أسماء";
    sel.appendChild(opt);
  }
}

function renderCriteria(){
  const container = document.getElementById("criteriaContainer");
  container.innerHTML = "";
  criteriaList.forEach((c, idx) => {
    const div = document.createElement("div");
    div.className = "criteria-simple";
    // simple layout: text then buttons then result span (no coloring)
    div.innerHTML = `
      <div>
        <span class="text">${c}</span>
        <span class="actions">
          <button onclick="setMark(this,'✔️')">✔️</button>
          <button onclick="setMark(this,'✖️')">✖️</button>
          <span class="result" data-index="${idx}"></span>
        </span>
      </div>
    `;
    container.appendChild(div);
  });
}

function setMark(btn, val){
  // set the result text in the same simple format (no styling change)
  const parent = btn.closest(".criteria-simple");
  const span = parent.querySelector(".result");
  span.textContent = val;
}

function resetView(){
  document.querySelectorAll(".result").forEach(r => r.textContent = "");
}

function showMistakes(){
  const results = [...document.querySelectorAll(".result")];
  const mistakes = [];
  results.forEach((r, i) => {
    if(r.textContent === "✖️") mistakes.push("- " + (criteriaList[i] || ("بند #" + (i+1))));
  });
  if(mistakes.length === 0) alert("لا توجد أخطاء ✔️");
  else alert("الأخطاء المسجّلة:\n\n" + mistakes.join("\n"));
}

/* Save evaluation */
function saveEvaluation(){
  const sel = document.getElementById("employeeSelect");
  const employee = sel.value;
  if(!employee) return alert("اختر موظف");

  const results = [...document.querySelectorAll(".result")];
  if(results.some(r => r.textContent === "")) return alert("قيّم كل البنود قبل الحفظ");

  const mistakes = [];
  results.forEach((r,i) => { if(r.textContent === "✖️") mistakes.push(criteriaList[i]); });

  const scoreStr = prompt("أدخل درجة الفيرنت (0 - 100):");
  if(scoreStr === null) return;
  const score = Number(scoreStr);
  if(isNaN(score) || score < 0) return alert("درجة غير صحيحة");

  evaluations.push({
    employee,
    score,
    errors: mistakes,
    date: new Date().toISOString()
  });

  localStorage.setItem(KEY_EVALS, JSON.stringify(evaluations));
  localStorage.setItem(KEY_LAST, employee);
  lastEvaluated = employee;
  loadEmployeeNames();

  alert("تم حفظ التقييم ✔️");
  resetView();
}

/* Reset month (delete evaluations only) */
function resetMonthData(){
  if(!confirm("هل أنت متأكد أنك تريد حذف جميع تقييمات هذا الشهر والبدء من جديد؟")) return;
  evaluations = [];
  lastEvaluated = "";
  localStorage.removeItem(KEY_EVALS);
  localStorage.removeItem(KEY_LAST);
  loadEmployeeNames();
  alert("تم حذف بيانات الشهر ✔️");
}

/* ===== Popups: employees & criteria management ===== */
function openEmployeePopup(){ document.getElementById("employeePopup").style.display = "block"; }
function closeEmployeePopup(){ document.getElementById("employeePopup").style.display = "none"; }

function saveEmployeesBulk(){
  const txt = document.getElementById("bulkEmployees").value;
  const names = txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s);
  if(names.length === 0){ alert("لا توجد أسماء"); return; }
  employees.push(...names);
  employees = [...new Set(employees)];
  localStorage.setItem(KEY_EMPLOYEES, JSON.stringify(employees));
  loadEmployeeNames();
  closeEmployeePopup();
  alert(names.length + " موظف تمت إضافتهم ✔️");
}

/* Criteria popup */
function openCriteriaPopup(){
  const div = document.getElementById("criteriaManage");
  div.innerHTML = "";
  criteriaList.forEach((c, i) => {
    const row = document.createElement("div");
    row.style.display = "flex";
    row.style.justifyContent = "space-between";
    row.style.alignItems = "center";
    row.style.padding = "6px 0";
    row.innerHTML = `<div style="flex:1">${c}</div><div><button onclick="deleteCriteria(${i})" class="secondary small">❌ حذف</button></div>`;
    div.appendChild(row);
  });
  document.getElementById("criteriaPopup").style.display = "block";
}
function closeCriteriaPopup(){ document.getElementById("criteriaPopup").style.display = "none"; }
function addCriteria(){
  const v = document.getElementById("newCriteria").value.trim();
  if(!v) return alert("اكتب بندًا جديدًا");
  criteriaList.push(v);
  localStorage.setItem(KEY_CRITERIA, JSON.stringify(criteriaList));
  renderCriteria();
  openCriteriaPopup();
}
function deleteCriteria(i){
  if(!confirm("هل تريد حذف هذا البند؟")) return;
  criteriaList.splice(i,1);
  localStorage.setItem(KEY_CRITERIA, JSON.stringify(criteriaList));
  renderCriteria();
  openCriteriaPopup();
}

/* ===== Backup export/import ===== */
function exportBackup(){
  const data = { employees, criteriaList, evaluations, lastEvaluated };
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "qa_backup.json";
  a.click();
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.employees) || !Array.isArray(data.criteriaList) || !Array.isArray(data.evaluations)){
        alert("ملف النسخة غير صالح");
        return;
      }
      employees = data.employees;
      criteriaList = data.criteriaList;
      evaluations = data.evaluations;
      lastEvaluated = data.lastEvaluated || "";
      localStorage.setItem(KEY_EMPLOYEES, JSON.stringify(employees));
      localStorage.setItem(KEY_CRITERIA, JSON.stringify(criteriaList));
      localStorage.setItem(KEY_EVALS, JSON.stringify(evaluations));
      localStorage.setItem(KEY_LAST, lastEvaluated);
      loadEmployeeNames();
      renderCriteria();
      alert("تم استيراد النسخة ✔️");
    } catch(err){
      alert("خطأ أثناء قراءة الملف");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ===========================
   EXCEL Export (ExcelJS) - professional sheets
   =========================== */
async function exportExcel(){
  if(typeof ExcelJS === "undefined"){
    alert("مكتبة ExcelJS غير متوفرة (راجع اتصال الإنترنت).");
    return;
  }

  const grouped = {};
  evaluations.forEach(ev => {
    if(!grouped[ev.employee]) grouped[ev.employee] = {scores: [], warnings: 0};
    grouped[ev.employee].scores.push(ev.score);
    if(ev.score === 0) grouped[ev.employee].warnings++;
  });

  const workbook = new ExcelJS.Workbook();
  workbook.creator = "QA System";
  workbook.created = new Date();

  /* ---- Overview ---- */
  const overview = workbook.addWorksheet("Overview");
  overview.views = [{state:'frozen', ySplit:1}];
  overview.columns = [
    {header:"الموظف", key:"emp", width:26},
    {header:"عدد التقييمات", key:"count", width:16},
    {header:"تقييم1", key:"e1", width:10},
    {header:"تقييم2", key:"e2", width:10},
    {header:"تقييم3", key:"e3", width:10},
    {header:"تقييم4", key:"e4", width:10},
    {header:"تقييم5", key:"e5", width:10},
    {header:"تقييم6", key:"e6", width:10},
    {header:"تقييم7", key:"e7", width:10},
    {header:"تقييم8", key:"e8", width:10},
    {header:"المتوسط", key:"avg", width:14},
    {header:"الإنذارات", key:"warn", width:12}
  ];
  overview.getRow(1).eachCell(cell => {
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'1E3A8A'}};
    cell.font = {color:{argb:'FFFFFF'}, bold:true};
    cell.alignment = {horizontal:'center', vertical:'middle'};
  });

  const summaryData = [];
  employees.forEach(emp => {
    const info = grouped[emp] || {scores: [], warnings: 0};
    const scores = info.scores.slice(0,8);
    while(scores.length < 8) scores.push("");
    const avg = info.scores.length ? (info.scores.reduce((a,b)=>a+b,0)/info.scores.length) : 0;
    const row = overview.addRow([emp + (emp === lastEvaluated ? " ⭐" : ""), info.scores.length, ...scores, avg, info.warnings]);

    if(row.number % 2 === 0){
      row.eachCell(c => c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'F8FAFC'}});
    }

    const avgCell = row.getCell(11);
    if(avg < 65){
      avgCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'DC2626'}};
      avgCell.font = {color:{argb:'FFFFFF'}, bold:true};
    } else if(avg < 85){
      avgCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FACC15'}};
      avgCell.font = {bold:true};
    } else {
      avgCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'16A34A'}};
      avgCell.font = {color:{argb:'FFFFFF'}, bold:true};
    }

    summaryData.push({emp, avg, warnings: info.warnings, count: info.scores.length});
  });

  overview.eachRow(row => {
    row.eachCell(cell => {
      cell.border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
      cell.alignment = {vertical:'middle'};
    });
  });

  /* ---- Top & Review ---- */
  const topSheet = workbook.addWorksheet("Top & Review");
  topSheet.views = [{state:'frozen', ySplit:1}];
  topSheet.columns = [
    {header:"الموظف", key:"emp", width:26},
    {header:"المتوسط", key:"avg", width:14},
    {header:"عدد التقييمات", key:"count", width:16},
    {header:"عدد الإنذارات", key:"warn", width:14}
  ];
  topSheet.getRow(1).eachCell(cell => {
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'1E3A8A'}};
    cell.font = {color:{argb:'FFFFFF'}, bold:true};
    cell.alignment = {horizontal:'center'};
  });

  const sortedForTop = summaryData.filter(s => s.count > 0).sort((a,b) => {
    if(b.avg !== a.avg) return b.avg - a.avg;
    return a.warnings - b.warnings;
  });
  sortedForTop.slice(0,5).forEach(r => {
    const row = topSheet.addRow([r.emp, Number(r.avg.toFixed(2)), r.count, r.warnings]);
    row.eachCell(c => c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'DCFCE7'}});
  });

  topSheet.addRow([]);

  const sortedForReview = summaryData.filter(s => s.count > 0).slice().sort((a,b) => {
    if(a.avg !== b.avg) return a.avg - b.avg;
    return b.warnings - a.warnings;
  }).slice(0,5);
  sortedForReview.forEach(r => {
    const row = topSheet.addRow([r.emp, Number(r.avg.toFixed(2)), r.count, r.warnings]);
    if(r.avg < 65){
      row.getCell(2).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'DC2626'}};
      row.getCell(2).font = {color:{argb:'FFFFFF'}, bold:true};
    } else {
      row.eachCell(c => c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FEF9C3'}});
    }
  });

  topSheet.eachRow(row => {
    row.eachCell(cell => {
      cell.border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
    });
  });

  /* ---- Performance Matrix ---- */
  const matrixSheet = workbook.addWorksheet("Performance Matrix");
  matrixSheet.addRow(["الموظف", ...criteriaList]);
  matrixSheet.getRow(1).eachCell(c => {
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'1E3A8A'}};
    c.font = {color:{argb:'FFFFFF'}, bold:true};
  });

  employees.forEach(emp => {
    const rowValues = [emp];
    criteriaList.forEach(c => {
      let count = 0;
      evaluations.forEach(ev => {
        if(ev.employee === emp && Array.isArray(ev.errors) && ev.errors.includes(c)) count++;
      });
      rowValues.push(count);
    });
    const r = matrixSheet.addRow(rowValues);
    criteriaList.forEach((c, idx) => {
      const cell = r.getCell(idx + 2);
      if(cell.value >= 6){
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'DC2626'}};
        cell.font = {color:{argb:'FFFFFF'}};
      } else if(cell.value >= 4){
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FACC15'}};
      }
    });
  });

  matrixSheet.eachRow(row => {
    row.eachCell(cell => {
      cell.border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
    });
  });

  /* ---- تفاصيل البنود ---- */
  const detailSheet = workbook.addWorksheet("تفاصيل البنود");
  detailSheet.columns = [
    {header:"البند", key:"crit", width:50},
    {header:"عدد مرات الإخفاق", key:"count", width:20},
    {header:"نسبة الإخفاق %", key:"pct", width:18}
  ];
  detailSheet.getRow(1).eachCell(c => {
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'1E3A8A'}};
    c.font = {color:{argb:'FFFFFF'}, bold:true};
  });
  const totalEvals = evaluations.length || 0;
  const criteriaStats = [];
  criteriaList.forEach(c => {
    let cnt = 0;
    evaluations.forEach(ev => { if(Array.isArray(ev.errors) && ev.errors.includes(c)) cnt++; });
    const pct = totalEvals ? ((cnt / totalEvals) * 100).toFixed(2) : "0.00";
    criteriaStats.push({c, cnt, pct});
  });
  criteriaStats.sort((a,b) => b.cnt - a.cnt);
  criteriaStats.forEach(s => {
    const r = detailSheet.addRow([s.c, s.cnt, s.pct]);
    r.eachCell(cell => { cell.border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}}; });
  });

  /* ---- KPIs ---- */
  const kpiSheet = workbook.addWorksheet("KPIs");
  const allScores = evaluations.map(e => e.score).filter(n => typeof n === "number");
  const teamAvg = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length) : 0;
  const totalWarnings = evaluations.filter(e => e.score === 0).length;
  const maxScore = allScores.length ? Math.max(...allScores) : 0;
  const minScore = allScores.length ? Math.min(...allScores) : 0;

  kpiSheet.addRow(["المؤشر", "القيمة"]);
  kpiSheet.addRow(["عدد التقييمات", evaluations.length]);
  kpiSheet.addRow(["متوسط الفريق", Number(teamAvg.toFixed(2))]);
  kpiSheet.addRow(["أعلى درجة", maxScore]);
  kpiSheet.addRow(["أقل درجة", minScore]);
  kpiSheet.addRow(["عدد الإنذارات", totalWarnings]);

  kpiSheet.getRow(1).eachCell(c => {
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'1E3A8A'}};
    c.font = {color:{argb:'FFFFFF'}, bold:true};
  });
  kpiSheet.eachRow(r => r.eachCell(c => c.border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}}));

  /* ---- Save file (mobile-friendly) ---- */
  workbook.xlsx.writeBuffer().then(buffer => {
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    saveAs(blob, "QA_Report_2.0.xlsx");
  }).catch(err => {
    console.error(err);
    alert("حدث خطأ أثناء إنشاء ملف الإكسل. جرّب من متصفح آخر أو أعطني تفاصيل الجهاز.");
  });
}

/* INIT UI */
function init(){
  if(!localStorage.getItem(KEY_CRITERIA)){
    localStorage.setItem(KEY_CRITERIA, JSON.stringify(criteriaList));
  } else {
    try{
      const stored = JSON.parse(localStorage.getItem(KEY_CRITERIA));
      if(Array.isArray(stored)) criteriaList = stored;
    }catch(e){}
  }
  if(!localStorage.getItem(KEY_EMPLOYEES)){
    localStorage.setItem(KEY_EMPLOYEES, JSON.stringify(employees));
  } else {
    try{
      const stored = JSON.parse(localStorage.getItem(KEY_EMPLOYEES));
      if(Array.isArray(stored)) employees = stored;
    }catch(e){}
  }
  try{
    const evs = JSON.parse(localStorage.getItem(KEY_EVALS));
    if(Array.isArray(evs)) evaluations = evs;
  }catch(e){}
  lastEvaluated = localStorage.getItem(KEY_LAST) || lastEvaluated;

  loadEmployeeNames();
  renderCriteria();
}
init();

</script>
