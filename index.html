<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام تقييم الجودة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{direction:rtl;font-family:Arial;background:#f4f6f8;padding:12px}
h2,h3{text-align:center}
.box{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
.item{border-bottom:1px solid #eee;padding:8px 0}
button{padding:6px 12px;margin:4px;font-size:15px}
select,textarea{width:100%;padding:8px;margin-top:6px}
.result{font-weight:bold;margin-right:10px}
.good{color:green}
.bad{color:red}
</style>
</head>
<body>

<h2>نظام تقييم المكالمات</h2>

<div class="box">
<h3>إدارة الموظفين</h3>
<select id="employee"></select>
<button onclick="addEmployee()">إضافة موظف</button>
<button onclick="deleteEmployee()">حذف</button>
<textarea id="bulk" rows="4" placeholder="أدخل الأسماء (سطر لكل اسم)"></textarea>
<button onclick="addBulk()">إضافة دفعة</button>
</div>

<div class="box">
<h3>بنود التقييم</h3>
<div id="criteria"></div>
<button onclick="saveEvaluation()">حفظ التقييم</button>
<button onclick="resetMarks()">إعادة التقييم</button>
</div>

<div class="box">
<h3>نهاية الشهر</h3>
<button onclick="exportExcel()">تحميل Excel</button>
<button onclick="clearAll()">حذف بيانات الشهر</button>
</div>

<script>
const criteriaList=[
"ترحيب بداية المكالمة وذكر الاسم",
"طلب اسم المشترك وذكره مرة واحدة",
"أخذ رقم الحساب أو استخدام وسائل مساعدة",
"مطابقة بيانات الحساب",
"أخذ إذن المشترك قبل وضعه على الانتظار",
"إدارة وقت المكالمة",
"شكر المشترك على الانتظار",
"استخدام كلمات عامية",
"نبرة صوت واضحة",
"التسويق لتوثيق العداد",
"توثيق المكالمة",
"إنهاء صحيح للمكالمة"
];

let employees=JSON.parse(localStorage.getItem("employees"))||[];
let evaluations=JSON.parse(localStorage.getItem("evaluations"))||[];

function renderEmployees(){
 let sel=document.getElementById("employee");
 sel.innerHTML="<option value=''>اختر موظف</option>";
 employees.forEach(e=>sel.innerHTML+=`<option>${e}</option>`);
}

function addEmployee(){
 let n=prompt("اسم الموظف:");
 if(n){employees.push(n);saveEmp();}
}

function addBulk(){
 let txt=document.getElementById("bulk").value;
 if(!txt) return;
 txt.split(/\n/).forEach(n=>{
   if(n.trim()) employees.push(n.trim());
 });
 employees=[...new Set(employees)];
 saveEmp();
}

function deleteEmployee(){
 let e=document.getElementById("employee").value;
 if(!e) return;
 employees=employees.filter(x=>x!==e);
 saveEmp();
}

function saveEmp(){
 localStorage.setItem("employees",JSON.stringify(employees));
 renderEmployees();
}

function renderCriteria(){
 let d=document.getElementById("criteria");
 d.innerHTML="";
 criteriaList.forEach(c=>{
   d.innerHTML+=`
   <div class="item">
   ${c}<br>
   <button onclick="mark(this,1)">✔️</button>
   <button onclick="mark(this,0)">✖️</button>
   <span class="result"></span>
   </div>`;
 });
}

function mark(btn,val){
 let r=btn.parentElement.querySelector(".result");
 r.textContent=val? "✔️":"✖️";
 r.className="result "+(val?"good":"bad");
 r.dataset.val=val;
}

function resetMarks(){
 document.querySelectorAll(".result").forEach(r=>{
   r.textContent="";r.dataset.val="";
 });
}

function saveEvaluation(){
 let emp=document.getElementById("employee").value;
 if(!emp) return alert("اختر موظف");
 let results=[...document.querySelectorAll(".result")];
 if(results.some(r=>r.dataset.val==="")) return alert("قيّم كل البنود");

 let score=prompt("أدخل درجة الفيرنت:");
 if(score===null || score==="") return;
 score=Number(score);

 let mistakes=[];
 results.forEach((r,i)=>{
   if(r.dataset.val==="0") mistakes.push(criteriaList[i]);
 });

 evaluations.push({
   name:emp,
   date:new Date().toLocaleDateString("ar-SA"),
   score:score,
   warning:score===0?1:0,
   mistakes:mistakes
 });

 localStorage.setItem("evaluations",JSON.stringify(evaluations));
 alert("تم حفظ التقييم");
 resetMarks();
}

function clearAll(){
 if(confirm("حذف كل البيانات؟")){
   localStorage.clear();
   employees=[];evaluations=[];
   renderEmployees();
 }
}

function exportExcel(){
 if(!evaluations.length) return alert("لا توجد بيانات");

 // Sheet 1: Summary
 let sum=[["الموظف","عدد التقييمات","متوسط الدرجة","عدد الإنذارات"]];
 employees.forEach(e=>{
   let ev=evaluations.filter(v=>v.name===e);
   let avg=(ev.reduce((s,x)=>s+x.score,0)/ev.length||0).toFixed(2);
   let warn=ev.filter(x=>x.warning).length;
   sum.push([e,ev.length,avg,warn]);
 });

 // Sheet 2: Top / Bottom
 let ranked=[...sum].slice(1).sort((a,b)=>b[2]-a[2]);
 let tb=[["أفضل 5"],...ranked.slice(0,5),[],["أسوأ 5"],...ranked.slice(-5)];

 // Sheet 3: Errors
 let err=[["البند","عدد التكرار"]];
 criteriaList.forEach(c=>{
   let count=0;
   evaluations.forEach(e=>{if(e.mistakes.includes(c)) count++;});
   err.push([c,count]);
 });

 // Sheet 4: Dashboard
 let totalEval=evaluations.length;
 let avgAll=(evaluations.reduce((s,x)=>s+x.score,0)/totalEval).toFixed(2);
 let totalWarn=evaluations.filter(x=>x.warning).length;
 let dash=[
 ["إجمالي التقييمات",totalEval],
 ["متوسط الأداء العام",avgAll],
 ["عدد الإنذارات",totalWarn]
 ];

 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Summary");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tb),"Top_Bottom");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(err),"Errors");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dash),"Dashboard");
 XLSX.writeFile(wb,"تقييم_الموظفين.xlsx");
}

renderEmployees();
renderCriteria();
</script>
</body>
</html>
