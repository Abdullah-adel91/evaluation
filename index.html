<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام تقييم الجودة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{direction:rtl;font-family:Arial;background:#f4f6f8;padding:12px}
h2,h3{text-align:center}
.box{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
.item{border-bottom:1px solid #eee;padding:8px 0}
button{padding:6px 12px;margin:4px;font-size:15px;cursor:pointer}
select{padding:8px;width:70%}
.result{font-weight:bold;margin-right:10px}
.good{color:green}
.bad{color:red}
.popup{
display:none;
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.5);
z-index:9999;
}
.popup-content{
background:#fff;
width:90%;
max-width:400px;
margin:100px auto;
padding:15px;
border-radius:10px;
}
textarea{width:100%;padding:8px}
</style>
</head>
<body>

<h2>نظام تقييم المكالمات</h2>

<div class="box">
<h3>اختيار الموظف</h3>
<select id="employee"></select>
<button onclick="openEmployeePopup()">➕ إضافة موظفين</button>
</div>

<div class="box">
<h3>بنود التقييم</h3>
<div id="criteria"></div>
<button onclick="showMistakes()">تصفية الأخطاء</button>
<button onclick="finalSave()">حفظ التقييم النهائي</button>
<button onclick="resetMarks()">إعادة التقييم</button>
</div>

<div class="box">
<h3>نهاية الشهر</h3>
<button onclick="exportExcel()">تحميل Excel</button>
<button onclick="clearAll()">حذف بيانات الشهر</button>
</div>

<!-- Popup إضافة موظفين -->
<div id="employeePopup" class="popup">
<div class="popup-content">
<h3>إضافة موظفين</h3>
<textarea id="employeeBulk" rows="8" placeholder="الصق الأسماء هنا (كل اسم في سطر)"></textarea>
<br><br>
<button onclick="saveEmployeesBulk()">حفظ</button>
<button onclick="closeEmployeePopup()">إلغاء</button>
</div>
</div>

<script>

const criteriaList=[
"ترحيب بداية المكالمة وذكر الاسم",
"طلب اسم المشترك وذكره مرة واحدة",
"أخذ رقم الحساب أو استخدام وسائل مساعدة",
"مطابقة بيانات الحساب",
"أخذ إذن المشترك قبل وضعه على الانتظار",
"إدارة وقت المكالمة",
"شكر المشترك على الانتظار",
"استخدام كلمات عامية",
"نبرة صوت واضحة",
"التسويق لتوثيق العداد",
"توثيق المكالمة",
"إنهاء صحيح للمكالمة"
];

let employees=JSON.parse(localStorage.getItem("employees"))||[];
let evaluations=JSON.parse(localStorage.getItem("evaluations"))||[];

function renderEmployees(){
 let sel=document.getElementById("employee");
 sel.innerHTML="<option value=''>اختر موظف</option>";
 employees.forEach(e=>sel.innerHTML+=`<option>${e}</option>`);
}

function renderCriteria(){
 let d=document.getElementById("criteria");
 d.innerHTML="";
 criteriaList.forEach(c=>{
   d.innerHTML+=`
   <div class="item">
   ${c}<br>
   <button onclick="mark(this,1)">✔️</button>
   <button onclick="mark(this,0)">✖️</button>
   <span class="result"></span>
   </div>`;
 });
}

function mark(btn,val){
 let r=btn.parentElement.querySelector(".result");
 r.textContent=val?"✔️":"✖️";
 r.className="result "+(val?"good":"bad");
 r.dataset.val=val;
}

function resetMarks(){
 document.querySelectorAll(".result").forEach(r=>{
   r.textContent="";
   r.dataset.val="";
 });
}

function showMistakes(){
 let emp=document.getElementById("employee").value;
 if(!emp) return alert("اختر موظف");
 let results=[...document.querySelectorAll(".result")];
 if(results.some(r=>r.dataset.val==="")) return alert("قيّم كل البنود");

 let mistakes=[];
 results.forEach((r,i)=>{
   if(r.dataset.val==="0") mistakes.push("- "+criteriaList[i]);
 });

 alert(mistakes.length?mistakes.join("\n"):"لا توجد أخطاء ✔️");
}

function finalSave(){
 let emp=document.getElementById("employee").value;
 if(!emp) return alert("اختر موظف");

 let results=[...document.querySelectorAll(".result")];
 if(results.some(r=>r.dataset.val==="")) return alert("قيّم كل البنود");

 let score=prompt("أدخل درجة الفيرنت:");
 if(score===null||score==="") return;
 score=Number(score);

 let mistakes=[];
 results.forEach((r,i)=>{
   if(r.dataset.val==="0") mistakes.push(criteriaList[i]);
 });

 evaluations.push({
   name:emp,
   date:new Date().toLocaleDateString("ar-SA"),
   score:score,
   warning:score===0?1:0,
   mistakes:mistakes
 });

 localStorage.setItem("evaluations",JSON.stringify(evaluations));
 document.getElementById("employee").value="";
 resetMarks();
 alert("تم حفظ التقييم بنجاح ✔️");
}

function exportExcel(){
 if(!evaluations.length) return alert("لا توجد بيانات");

 let avgTeam=(evaluations.reduce((s,x)=>s+x.score,0)/evaluations.length).toFixed(2);
 let totalWarn=evaluations.filter(x=>x.warning).length;

 let kpis=[
 ["المؤشر","القيمة"],
 ["عدد التقييمات",evaluations.length],
 ["متوسط الفريق",avgTeam],
 ["عدد الإنذارات",totalWarn]
 ];

 let summary=[["الموظف","عدد التقييمات",
 "تقييم1","تقييم2","تقييم3","تقييم4",
 "تقييم5","تقييم6","تقييم7","تقييم8",
 "المتوسط","الإنذارات"]];

 employees.forEach(e=>{
   let ev=evaluations.filter(v=>v.name===e);
   let scores=ev.map(v=>v.score).slice(0,8);
   while(scores.length<8) scores.push("");
   let valid=scores.filter(x=>x!=="");
   let avg=(valid.reduce((a,b)=>a+b,0)/valid.length||0).toFixed(2);
   let warn=ev.filter(x=>x.warning).length;
   summary.push([e,ev.length,...scores,avg,warn]);
 });

 let follow=[["الموظف","المتوسط","الحالة"]];
 summary.slice(1).forEach(r=>{
   if(r[10]<75){
     follow.push([r[0],r[10],"يحتاج متابعة"]);
   }
 });

 let err=[["البند","عدد التكرار"]];
 criteriaList.forEach(c=>{
   let count=0;
   evaluations.forEach(e=>{
     if(e.mistakes.includes(c)) count++;
   });
   err.push([c,count]);
 });

 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(kpis),"KPIs");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),"ملخص الموظفين");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(follow),"يحتاج متابعة");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(err),"تحليل الأخطاء");
 XLSX.writeFile(wb,"تقييم_الجودة.xlsx");
}

function clearAll(){
 if(confirm("حذف كل البيانات؟")){
   localStorage.clear();
   employees=[];
   evaluations=[];
   renderEmployees();
 }
}

function openEmployeePopup(){
 document.getElementById("employeePopup").style.display="block";
}

function closeEmployeePopup(){
 document.getElementById("employeePopup").style.display="none";
 document.getElementById("employeeBulk").value="";
}

function saveEmployeesBulk(){
 let txt=document.getElementById("employeeBulk").value;
 if(!txt) return alert("لا توجد أسماء");

 let names=txt.split(/\r?\n/)
   .map(n=>n.trim())
   .filter(n=>n);

 employees.push(...names);
 employees=[...new Set(employees)];

 localStorage.setItem("employees",JSON.stringify(employees));
 renderEmployees();
 closeEmployeePopup();
 alert("تمت إضافة "+names.length+" موظف ✔️");
}

renderEmployees();
renderCriteria();

</script>
</body>
</html>
