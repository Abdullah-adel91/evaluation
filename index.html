<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام تقييم الجودة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body{direction:rtl;font-family:Arial;background:#f4f4f4;padding:10px}
.item{background:#fff;padding:10px;margin:6px 0;border-radius:8px}
button{padding:6px 12px;margin:3px;font-size:15px}
.result{font-weight:bold;margin-right:8px}
select,input,textarea{padding:8px;font-size:15px;margin-top:5px}
.badge{padding:4px 8px;border-radius:6px;color:#fff;font-size:13px}
.green{background:#2ecc71}
.yellow{background:#f1c40f}
.red{background:#e74c3c}
</style>
</head>

<body>

<h2 style="text-align:center">نظام تقييم الجودة</h2>

<!-- الموظفين -->
<div class="item">
<label>اسم الموظف:</label>
<select id="employee"></select>
<button onclick="addEmployee()">إضافة</button>
<button onclick="deleteEmployee()">حذف</button>
<br><br>
<textarea id="bulk" rows="3" placeholder="إضافة أسماء (سطر لكل اسم)"></textarea><br>
<button onclick="addBulk()">إضافة جميع الأسماء</button>
</div>

<!-- التقييم -->
<h3>بنود التقييم</h3>
<div id="criteria"></div>
<button onclick="saveEvaluation()">💾 حفظ التقييم</button>
<button onclick="resetMarks()">🔄 إعادة التقييم</button>

<hr>

<button onclick="exportExcel()">📊 تصدير Excel</button>
<button onclick="clearMonth()">❌ حذف بيانات الشهر</button>

<script>
/* ===== البيانات ===== */
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let evaluations = JSON.parse(localStorage.getItem("evaluations")) || [];

const criteriaList = [
 {name:"ترحيب بداية المكالمة"},
 {name:"طلب رقم الحساب"},
 {name:"نبرة صوت واضحة", hint:"لا تكون ناشف – لا ترفع صوتك – لا تكون بارد"},
 {name:"إدارة وقت المكالمة"},
 {name:"توثيق المكالمة"},
 {name:"إغلاق المكالمة بشكل صحيح"}
];

/* ===== تحميل ===== */
function loadEmployees(){
 const sel=document.getElementById("employee");
 sel.innerHTML="<option value=''>اختر</option>";
 employees.forEach(e=>sel.innerHTML+=`<option>${e}</option>`);
}

/* ===== بنود ===== */
function renderCriteria(){
 const div=document.getElementById("criteria");
 div.innerHTML="";
 criteriaList.forEach(c=>{
  div.innerHTML+=`
  <div class="item">
   <strong>${c.name}</strong>
   ${c.hint?`<div style="font-size:13px;color:#666">${c.hint}</div>`:""}
   <br>
   <button onclick="mark(this,'✔️')">✔️</button>
   <button onclick="mark(this,'✖️')">✖️</button>
   <span class="result"></span>
  </div>`;
 });
}
function mark(btn,val){
 btn.parentElement.querySelector(".result").innerText=val;
}
function resetMarks(){
 document.querySelectorAll(".result").forEach(r=>r.innerText="");
}

/* ===== حفظ التقييم ===== */
function saveEvaluation(){
 const emp=document.getElementById("employee").value;
 if(!emp) return alert("اختر موظف");

 const results=[...document.querySelectorAll(".result")];
 if(results.some(r=>!r.innerText)) return alert("قيّم كل البنود");

 let score=prompt("ادخل درجة الفيرنت (0 - 100):");
 if(score===null) return;
 score=parseFloat(score);
 if(isNaN(score)||score<0||score>100) return alert("درجة غير صحيحة");

 const mistakes=[];
 results.forEach((r,i)=>{
  if(r.innerText==="✖️") mistakes.push(criteriaList[i].name);
 });

 evaluations.push({
  name:emp,
  date:new Date().toLocaleDateString('ar-SA'),
  score:score,
  warning:score===0?1:0,
  mistakes:mistakes
 });

 localStorage.setItem("evaluations",JSON.stringify(evaluations));

 let badge=score>=90?"green":score>=75?"yellow":"red";
 alert(`تم الحفظ | الدرجة: ${score}`);
 resetMarks();
}

/* ===== إدارة الموظفين ===== */
function addEmployee(){
 const n=prompt("اسم الموظف:");
 if(n){employees.push(n);saveEmployees();}
}
function addBulk(){
 const lines=document.getElementById("bulk").value.split(/\n/).map(x=>x.trim()).filter(x=>x);
 employees=[...new Set([...employees,...lines])];
 saveEmployees();
}
function deleteEmployee(){
 const e=document.getElementById("employee").value;
 if(e && confirm("حذف الموظف؟")){
  employees=employees.filter(x=>x!==e);
  saveEmployees();
 }
}
function saveEmployees(){
 localStorage.setItem("employees",JSON.stringify(employees));
 loadEmployees();
}

/* ===== Excel ===== */
function exportExcel(){
 if(evaluations.length===0) return alert("لا توجد بيانات");

 const summary=[["الموظف","عدد التقييمات","متوسط الدرجة","أعلى","أقل","إنذارات","مستوى الأداء"]];
 employees.forEach(e=>{
  const ev=evaluations.filter(x=>x.name===e);
  if(!ev.length) return;
  const scores=ev.map(x=>x.score);
  const avg=(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2);
  const level=avg>=90?"ممتاز":avg>=75?"جيد":"يحتاج تحسين";
  summary.push([e,ev.length,avg,Math.max(...scores),Math.min(...scores),ev.filter(x=>x.warning).length,level]);
 });

 const mistakesCount={};
 evaluations.forEach(e=>e.mistakes.forEach(m=>mistakesCount[m]=(mistakesCount[m]||0)+1));
 const mistakeSheet=[["البند","عدد التكرار","النسبة %"]];
 Object.keys(mistakesCount).forEach(m=>{
  mistakeSheet.push([m,mistakesCount[m],((mistakesCount[m]/evaluations.length)*100).toFixed(1)]);
 });

 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),"Employees Summary");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mistakeSheet),"Mistake Analysis");
 XLSX.writeFile(wb,"Quality_Report.xlsx");
}

/* ===== حذف الشهر ===== */
function clearMonth(){
 if(confirm("حذف كل بيانات الشهر؟")){
  localStorage.removeItem("evaluations");
  evaluations=[];
  alert("تم الحذف");
 }
}

loadEmployees();
renderCriteria();
</script>

</body>
</html>
